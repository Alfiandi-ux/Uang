name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build UANG APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Tentukan versi
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Siapkan keystore rilis
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.UANG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret UANG_KEYSTORE_BASE64 belum diatur. Lihat README bagian 'Menandatangani APK'."
            exit 1
          fi
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks
          test -s android/keystore/release.jks

      - name: Build Release APK
        shell: bash
        env:
          UANG_KEYSTORE_PATH: keystore/release.jks
          UANG_KEYSTORE_PASSWORD: ${{ secrets.UANG_KEYSTORE_PASSWORD }}
          UANG_KEY_ALIAS: ${{ secrets.UANG_KEY_ALIAS }}
          UANG_KEY_PASSWORD: ${{ secrets.UANG_KEY_PASSWORD }}
          UANG_VERSION_CODE: ${{ steps.version.outputs.code }}
          UANG_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          cd android
          gradle assembleRelease --no-daemon
          cd ..
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Uang.apk
          test -s dist/Uang.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Uang-APK
          path: dist/Uang.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: "UANG ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: dist/Uang.apk
          body: |
            ## 📱 UANG ${{ github.ref_name }} — Edisi Claymorphism Pastel

            Aplikasi pencatatan keuangan pribadi **UANG** bergaya **Claymorphism Pastel**, 100% offline, tanpa akun, tanpa server. Desain baru yang empuk, 3D lembut, dan estetik!

            ### ⬇️ Download APK
            - **[Uang.apk](https://github.com/Alfiandi-ux/Uang/releases/latest/download/Uang.apk)**

            ### ✨ Yang Baru di Versi Ini:
            - 🎨 **Tema Claymorphism & Warna Pastel:** Tampilan baru dengan efek 3D timbul (*inflated clay*), dual inset shadow, dan palet warna pastel yang nyaman di mata.
            - 🫧 **Komponen Tactile:** Sudut membulat halus pada semua kartu, tombol, dan formulir dengan feedback interaktif saat disentuh.
            - 📊 **Grafik Kapsul & Donut Bersih:** Visualisasi keuangan lebih elegan tanpa garis hitam tebal.
            - 📱 **Navigasi Mengambang & FAB 3D:** Tab bar bawah mengambang dengan efek frosted glass serta floating button 3D clay.

            ### 🚀 Cara Pasang di HP Android:
            1. Unduh berkas **`Uang.apk`** dari tautan di atas.
            2. Buka berkas APK yang telah didownload.
            3. Jika muncul konfirmasi keamanan, aktifkan **Izinkan dari sumber ini** (*Allow unknown apps*).
            4. Tekan **Instal / Pasang**.
            5. Selesai! UANG siap digunakan secara offline.
