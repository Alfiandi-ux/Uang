<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Ikon UANG Claymorphism">
  <defs>
    <linearGradient id="clayBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="50%" stop-color="#EDE9FE"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
    <filter id="clayShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#818CF8" flood-opacity="0.35"/>
    </filter>
    <filter id="coinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#CA8A04" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#clayBg)" filter="url(#clayShadow)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.8"/>

  <!-- Clay Coin -->
  <circle cx="256" cy="256" r="148" fill="url(#coinGrad)" filter="url(#coinShadow)"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.9"/>
  <circle cx="256" cy="256" r="128" fill="none" stroke="#FDE047" stroke-width="3" stroke-dasharray="8 8"/>

  <!-- Currency Text -->
  <text x="256" y="275" text-anchor="middle" dominant-baseline="middle" fill="#713F12" font-family="'Archivo', system-ui, sans-serif" font-weight="900" font-size="140" letter-spacing="-6">Rp</text>

  <!-- Pastel Sparkles -->
  <path d="M376 130l7 20 20 7-20 7-7 20-7-20-20-7 20-7z" fill="#FFFFFF" fill-opacity="0.95"/>
  <path d="M120 330l5 15 15 5-15 5-5 15-5-15-15-5 15-5z" fill="#A7F3D0" fill-opacity="0.95"/>
  <path d="M380 340l5 14 14 5-14 5-5 14-5-14-14-5 14-5z" fill="#FDA4AF" fill-opacity="0.95"/>
</svg>
