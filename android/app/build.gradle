plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new java.util.Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new java.io.FileInputStream(keystorePropertiesFile))
}

def signingStorePath = System.getenv('UANG_KEYSTORE_PATH') ?: keystoreProperties.getProperty('storeFile')
def signingStorePassword = System.getenv('UANG_KEYSTORE_PASSWORD') ?: keystoreProperties.getProperty('storePassword')
def signingKeyAlias = System.getenv('UANG_KEY_ALIAS') ?: keystoreProperties.getProperty('keyAlias')
def signingKeyPassword = System.getenv('UANG_KEY_PASSWORD') ?: keystoreProperties.getProperty('keyPassword')
def signingStoreFile = signingStorePath ? rootProject.file(signingStorePath) : null
def hasReleaseSigning = signingStoreFile != null && signingStoreFile.exists() &&
    signingStorePassword && signingKeyAlias && signingKeyPassword

android {
    namespace 'com.alfiandi.uang'
    compileSdk 34

    defaultConfig {
        applicationId "com.alfiandi.uang"
        minSdk 24
        targetSdk 34
        versionCode ((System.getenv('UANG_VERSION_CODE') ?: '2').toInteger())
        versionName (System.getenv('UANG_VERSION_NAME') ?: '1.1.0')

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile signingStoreFile
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Debug tidak memakai kunci rilis.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
}

gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { task ->
        task.name == 'assembleRelease' || task.name == 'bundleRelease'
    }
    if (wantsRelease && !hasReleaseSigning) {
        throw new GradleException(
            'Keystore rilis belum dikonfigurasi. Isi android/keystore.properties ' +
            'atau atur env UANG_KEYSTORE_PATH, UANG_KEYSTORE_PASSWORD, UANG_KEY_ALIAS, dan UANG_KEY_PASSWORD.'
        )
    }
}

// Copy root web app assets automatically into APK assets before build
tasks.register('syncWebAssets', Copy) {
    from("${projectDir}/../../") {
        include 'index.html'
        include 'manifest.webmanifest'
        include 'sw.js'
        include 'icon.svg'
        include 'icon-*.png'
        include 'assets/**'
    }
    into "${projectDir}/src/main/assets"
}

preBuild.dependsOn(syncWebAssets)
